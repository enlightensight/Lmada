<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a6fa5"/>
      <stop offset="1" stop-color="#3d5d8c"/>
    </linearGradient>
    <pattern id="dots" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="30" r="2" fill="#ffffff" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#dots)"/>

  <!-- central molecule network -->
  <g stroke-linecap="round">
    <!-- bonds -->
    <g stroke="#ffffff" stroke-width="6" opacity="0.85">
      <line x1="600" y1="330" x2="480" y2="260"/>
      <line x1="600" y1="330" x2="720" y2="260"/>
      <line x1="600" y1="330" x2="600" y2="470"/>
      <line x1="480" y1="260" x2="380" y2="330"/>
      <line x1="720" y1="260" x2="820" y2="330"/>
      <line x1="380" y1="330" x2="460" y2="430"/>
      <line x1="820" y1="330" x2="740" y2="430"/>
      <line x1="460" y1="430" x2="600" y2="470"/>
      <line x1="740" y1="430" x2="600" y2="470"/>
    </g>
    <g stroke="#f5c842" stroke-width="6">
      <line x1="600" y1="330" x2="600" y2="200"/>
      <line x1="480" y1="260" x2="420" y2="160"/>
      <line x1="720" y1="260" x2="780" y2="160"/>
    </g>

    <!-- atoms -->
    <circle cx="600" cy="330" r="34" fill="#f5c842"/>
    <circle cx="600" cy="330" r="34" fill="none" stroke="#ffffff" stroke-width="4"/>
    <circle cx="480" cy="260" r="24" fill="#ffffff"/>
    <circle cx="720" cy="260" r="24" fill="#ffffff"/>
    <circle cx="600" cy="470" r="24" fill="#ffffff"/>
    <circle cx="380" cy="330" r="20" fill="#f5c842"/>
    <circle cx="820" cy="330" r="20" fill="#f5c842"/>
    <circle cx="460" cy="430" r="16" fill="#ffffff" opacity="0.9"/>
    <circle cx="740" cy="430" r="16" fill="#ffffff" opacity="0.9"/>
    <circle cx="600" cy="200" r="18" fill="#f5c842"/>
    <circle cx="420" cy="160" r="14" fill="#f5c842"/>
    <circle cx="780" cy="160" r="14" fill="#f5c842"/>
  </g>

  <!-- hexagon ring accent -->
  <polygon points="960,420 1010,450 1010,510 960,540 910,510 910,450"
           fill="none" stroke="#f5c842" stroke-width="6" opacity="0.9"/>
  <polygon points="180,120 225,147 225,201 180,228 135,201 135,147"
           fill="none" stroke="#ffffff" stroke-width="6" opacity="0.7"/>

  <!-- small floating atoms -->
  <g fill="#ffffff" opacity="0.75">
    <circle cx="250" cy="520" r="8"/>
    <circle cx="1010" cy="200" r="8"/>
    <circle cx="140" cy="320" r="6"/>
  </g>
  <g fill="#f5c842">
    <circle cx="1050" cy="560" r="9"/>
    <circle cx="300" cy="140" r="9"/>
  </g>
</svg>
