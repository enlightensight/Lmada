<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d5d8c"/>
      <stop offset="1" stop-color="#4a6fa5"/>
    </linearGradient>
    <pattern id="dots" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="30" r="2" fill="#ffffff" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#dots)"/>

  <!-- large erlenmeyer flask -->
  <g>
    <path d="M540 120 L540 240 L420 520 Q400 580 460 580 L740 580 Q800 580 780 520 L660 240 L660 120"
          fill="#ffffff" opacity="0.12"/>
    <path d="M540 120 L540 240 L420 520 Q400 580 460 580 L740 580 Q800 580 780 520 L660 240 L660 120"
          fill="none" stroke="#ffffff" stroke-width="8" stroke-linejoin="round"/>
    <line x1="520" y1="120" x2="680" y2="120" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
    <!-- yellow liquid -->
    <path d="M470 420 L730 420 L780 520 Q800 580 740 580 L460 580 Q400 580 420 520 Z" fill="#f5c842"/>
    <!-- measurement marks -->
    <g stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.8">
      <line x1="540" y1="300" x2="575" y2="300"/>
      <line x1="530" y1="350" x2="565" y2="350"/>
      <line x1="660" y1="300" x2="625" y2="300"/>
    </g>
  </g>

  <!-- rising bubbles -->
  <g fill="#ffffff">
    <circle cx="560" cy="460" r="9" opacity="0.9"/>
    <circle cx="610" cy="500" r="7" opacity="0.8"/>
    <circle cx="650" cy="450" r="6" opacity="0.7"/>
    <circle cx="590" cy="530" r="5" opacity="0.85"/>
  </g>
  <g fill="#f5c842">
    <circle cx="700" cy="200" r="10"/>
    <circle cx="730" cy="150" r="7"/>
    <circle cx="470" cy="170" r="8"/>
    <circle cx="445" cy="120" r="6"/>
  </g>

  <!-- small test tube -->
  <g>
    <rect x="880" y="260" width="60" height="240" rx="30" fill="none" stroke="#ffffff" stroke-width="8"/>
    <path d="M888 380 L932 380 L932 470 Q932 492 910 492 Q888 492 888 470 Z" fill="#f5c842"/>
    <line x1="870" y1="260" x2="950" y2="260" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- petri dish -->
  <g>
    <ellipse cx="270" cy="500" rx="110" ry="36" fill="none" stroke="#ffffff" stroke-width="8"/>
    <ellipse cx="270" cy="492" rx="110" ry="36" fill="#f5c842" opacity="0.9"/>
    <ellipse cx="270" cy="480" rx="110" ry="36" fill="none" stroke="#ffffff" stroke-width="8"/>
    <circle cx="240" cy="480" r="9" fill="#3d5d8c"/>
    <circle cx="295" cy="488" r="7" fill="#3d5d8c"/>
    <circle cx="268" cy="470" r="5" fill="#3d5d8c"/>
  </g>
</svg>
