<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a6fa5"/>
      <stop offset="1" stop-color="#3d5d8c"/>
    </linearGradient>
    <pattern id="dots" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="30" r="2" fill="#ffffff" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#dots)"/>

  <!-- floor line -->
  <line x1="80" y1="640" x2="1120" y2="640" stroke="#ffffff" stroke-width="3" opacity="0.3"/>

  <!-- bioreactor vessel -->
  <g>
    <!-- inlet pipes -->
    <line x1="460" y1="80" x2="460" y2="180" stroke="#ffffff" stroke-width="10" opacity="0.9"/>
    <line x1="540" y1="80" x2="540" y2="180" stroke="#f5c842" stroke-width="10"/>
    <line x1="620" y1="80" x2="620" y2="180" stroke="#ffffff" stroke-width="10" opacity="0.9"/>
    <circle cx="460" cy="80" r="14" fill="#f5c842"/>
    <circle cx="540" cy="80" r="14" fill="#ffffff"/>
    <circle cx="620" cy="80" r="14" fill="#f5c842"/>

    <!-- vessel body -->
    <path d="M400 220 Q400 180 440 180 L640 180 Q680 180 680 220 L680 560 Q680 600 640 600 L440 600 Q400 600 400 560 Z"
          fill="#ffffff" opacity="0.12"/>
    <path d="M400 220 Q400 180 440 180 L640 180 Q680 180 680 220 L680 560 Q680 600 640 600 L440 600 Q400 600 400 560 Z"
          fill="none" stroke="#ffffff" stroke-width="6"/>

    <!-- yellow culture liquid -->
    <path d="M412 380 L668 380 L668 560 Q668 588 640 588 L440 588 Q412 588 412 560 Z" fill="#f5c842"/>
    <line x1="412" y1="380" x2="668" y2="380" stroke="#f5c842" stroke-width="6"/>

    <!-- impeller shaft -->
    <line x1="540" y1="180" x2="540" y2="560" stroke="#ffffff" stroke-width="6" opacity="0.8"/>
    <line x1="500" y1="460" x2="580" y2="460" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
    <line x1="500" y1="520" x2="580" y2="520" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>

    <!-- sight glass -->
    <rect x="428" y="230" width="36" height="110" rx="8" fill="none" stroke="#f5c842" stroke-width="5"/>
    <line x1="428" y1="300" x2="464" y2="300" stroke="#f5c842" stroke-width="5"/>

    <!-- legs -->
    <line x1="440" y1="600" x2="440" y2="640" stroke="#ffffff" stroke-width="10"/>
    <line x1="640" y1="600" x2="640" y2="640" stroke="#ffffff" stroke-width="10"/>
  </g>

  <!-- control panel -->
  <g>
    <rect x="800" y="340" width="240" height="260" rx="12" fill="#f5c842"/>
    <rect x="824" y="364" width="192" height="90" rx="8" fill="#3d5d8c"/>
    <polyline points="836,430 870,400 904,420 938,385 972,410 1004,392"
              fill="none" stroke="#f5c842" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="850" cy="510" r="18" fill="#3d5d8c"/>
    <circle cx="920" cy="510" r="18" fill="#3d5d8c"/>
    <circle cx="990" cy="510" r="18" fill="#3d5d8c"/>
    <circle cx="850" cy="510" r="7" fill="#ffffff"/>
    <circle cx="920" cy="510" r="7" fill="#ffffff"/>
    <circle cx="990" cy="510" r="7" fill="#ffffff"/>
    <rect x="824" y="556" width="192" height="20" rx="10" fill="#3d5d8c"/>
    <line x1="800" y1="600" x2="800" y2="640" stroke="#f5c842" stroke-width="10"/>
    <line x1="1040" y1="600" x2="1040" y2="640" stroke="#f5c842" stroke-width="10"/>
  </g>

  <!-- side flasks -->
  <g stroke="#ffffff" stroke-width="6" fill="none" opacity="0.9">
    <path d="M210 440 L210 400 L250 400 L250 440 L290 560 Q296 600 260 600 L200 600 Q164 600 170 560 Z"/>
  </g>
  <path d="M183 520 L277 520 L290 560 Q296 600 260 600 L200 600 Q164 600 170 560 Z" fill="#f5c842"/>
  <circle cx="230" cy="470" r="7" fill="#ffffff"/>
  <circle cx="222" cy="490" r="5" fill="#ffffff"/>
  <circle cx="238" cy="500" r="4" fill="#ffffff"/>

  <!-- bubbles from vessel -->
  <g fill="#ffffff" opacity="0.7">
    <circle cx="720" cy="300" r="8"/>
    <circle cx="748" cy="260" r="6"/>
    <circle cx="730" cy="220" r="5"/>
    <circle cx="760" cy="180" r="4"/>
  </g>
</svg>
