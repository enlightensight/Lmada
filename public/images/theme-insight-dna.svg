<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d5d8c"/>
      <stop offset="1" stop-color="#4a6fa5"/>
    </linearGradient>
    <pattern id="dots" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="30" r="2" fill="#ffffff" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#dots)"/>

  <!-- rungs (drawn first, behind strands) -->
  <g stroke-width="6" stroke-linecap="round" opacity="0.9">
    <line x1="160" y1="257" x2="160" y2="417" stroke="#ffffff"/>
    <line x1="360" y1="257" x2="360" y2="417" stroke="#f5c842"/>
    <line x1="560" y1="257" x2="560" y2="417" stroke="#ffffff"/>
    <line x1="760" y1="257" x2="760" y2="417" stroke="#f5c842"/>
    <line x1="960" y1="257" x2="960" y2="417" stroke="#ffffff"/>
  </g>
  <!-- base pair nodes -->
  <g>
    <circle cx="160" cy="257" r="9" fill="#f5c842"/>
    <circle cx="160" cy="417" r="9" fill="#f5c842"/>
    <circle cx="360" cy="257" r="9" fill="#ffffff"/>
    <circle cx="360" cy="417" r="9" fill="#ffffff"/>
    <circle cx="560" cy="257" r="9" fill="#f5c842"/>
    <circle cx="560" cy="417" r="9" fill="#f5c842"/>
    <circle cx="760" cy="257" r="9" fill="#ffffff"/>
    <circle cx="760" cy="417" r="9" fill="#ffffff"/>
    <circle cx="960" cy="257" r="9" fill="#f5c842"/>
    <circle cx="960" cy="417" r="9" fill="#f5c842"/>
  </g>

  <!-- interweaving strands -->
  <path d="M-20 337 Q 60 197, 160 337 T 360 337 T 560 337 T 760 337 T 960 337 T 1160 337 T 1360 337"
        fill="none" stroke="#f5c842" stroke-width="10" stroke-linecap="round" transform="translate(50,0) scale(0.92,1)"/>
  <path d="M-20 337 Q 60 477, 160 337 T 360 337 T 560 337 T 760 337 T 960 337 T 1160 337 T 1360 337"
        fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" transform="translate(50,0) scale(0.92,1)"/>

  <!-- small faint helix fragment bottom-right -->
  <g opacity="0.35">
    <path d="M820 560 Q 870 500, 920 560 T 1020 560 T 1120 560" fill="none" stroke="#f5c842" stroke-width="7" stroke-linecap="round"/>
    <path d="M820 560 Q 870 620, 920 560 T 1020 560 T 1120 560" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
    <line x1="920" y1="530" x2="920" y2="590" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <line x1="1020" y1="530" x2="1020" y2="590" stroke="#f5c842" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- floating accents -->
  <circle cx="120" cy="120" r="9" fill="#f5c842"/>
  <circle cx="1080" cy="140" r="8" fill="#ffffff" opacity="0.8"/>
  <circle cx="150" cy="540" r="8" fill="#ffffff" opacity="0.8"/>
</svg>
