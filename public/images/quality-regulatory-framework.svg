  <line x1="720.2081528017131" y1="329.7918471982869" x2="833.3452377915607" y2="216.6547622084393" stroke="#f58634" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="3 3"/>
  <circle cx="720.2081528017131" cy="329.7918471982869" r="4" fill="#f58634"/>

