    <circle cx="600.0" cy="450.0" r="122" fill="none" stroke="#f58634" stroke-width="1.5" stroke-dasharray="6 4"/>
    
    <!-- Shield Icon in Center -->
    <path d="M 600.0 375.0 L 626.0 390.0 V 415.0 C 626.0 438.0 600.0 450.0 600.0 450.0 C 600.0 450.0 574.0 438.0 574.0 415.0 V 390.0 Z" fill="none" stroke="#f58634" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M 591.0 406.0 L 598.0 413.0 L 611.0 398.0" fill="none" stroke="#00aeef" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Central Typography -->
    <text x="600.0" y="468.0" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff" letter-spacing="0.5">QUALITY &amp; REGULATORY</text>
    <text x="600.0" y="488.0" text-anchor="middle" font-size="13" font-weight="700" fill="#00aeef" letter-spacing="1.5">FRAMEWORK</text>
    <rect x="540.0" y="497.0" width="120" height="1.5" fill="#f58634"/>
    <text x="600.0" y="513.0" text-anchor="middle" font-size="10" font-weight="600" fill="#cbd5e1" letter-spacing="0.8">cGMP • DATA INTEGRITY • ICH</text>
    <text x="600.0" y="528.0" text-anchor="middle" font-size="9" font-weight="500" fill="#94a3b8">Lambda Biologics CDMO</text>
  </g>
