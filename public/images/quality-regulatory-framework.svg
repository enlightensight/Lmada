    <rect x="261.65476220843925" y="178.65476220843934" width="6" height="76" rx="3" fill="#f58634"/>
    <text x="279.65476220843925" y="202.65476220843934" font-size="12" font-weight="700" fill="#0f2231">Change Control &amp; QMS</text>
    <rect x="279.65476220843925" y="210.65476220843934" width="120.5" height="17" rx="4" fill="#f5863415"/>
    <text x="284.65476220843925" y="222.65476220843934" font-size="9.5" font-weight="700" fill="#f58634">CAPA • Deviations</text>
    <text x="279.65476220843925" y="240.65476220843934" font-size="9" font-weight="500" fill="#64748b">Continuous Process Improvement</text>
  </g>


  <!-- Center Circular Medallion -->
  <g filter="url(#centerShadow)">
