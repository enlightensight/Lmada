  <g filter="url(#cardShadow)">
    <rect x="728.3452377915607" y="178.6547622084393" width="210" height="76" rx="12" fill="#ffffff" stroke="#f58634" stroke-width="1.75"/>
    <rect x="728.3452377915607" y="178.6547622084393" width="6" height="76" rx="3" fill="#f58634"/>
    <text x="746.3452377915607" y="202.6547622084393" font-size="12" font-weight="700" fill="#0f2231">Data Integrity &amp; ALCOA+</text>
