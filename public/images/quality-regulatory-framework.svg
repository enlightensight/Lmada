    <text x="173.0" y="456.00000000000006" font-size="9.5" font-weight="700" fill="#00aeef">IQ • OQ • PQ</text>
    <text x="168.0" y="474.00000000000006" font-size="9" font-weight="500" fill="#64748b">Cleanroom &amp; Single-Use Validation</text>
