<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00aeef"/>
      <stop offset="100%" stop-color="#0088cc"/>
    </linearGradient>
    <linearGradient id="orangeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f58634"/>
      <stop offset="100%" stop-color="#d9731f"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f2231"/>
      <stop offset="100%" stop-color="#1b3a4f"/>
    </linearGradient>
    
    <!-- Filter for soft shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f2231" flood-opacity="0.08"/>
    </filter>
    <filter id="centerShadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#00aeef" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bgGlow)"/>
  
  <!-- Subtle circular grid rings -->
  <circle cx="600.0" cy="450.0" r="380" fill="none" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4 6"/>
  <circle cx="600.0" cy="450.0" r="270" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="600.0" cy="450.0" r="170" fill="none" stroke="#00aeef" stroke-opacity="0.25" stroke-width="2"/>

  <!-- Connector -->
  <line x1="600.0" y1="280.0" x2="600.0" y2="120.0" stroke="#00aeef" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="3 3"/>
  <circle cx="600.0" cy="280.0" r="4" fill="#00aeef"/>

  <!-- Node: Global cGMP Standards -->
  <g filter="url(#cardShadow)">
    <rect x="495.0" y="82.0" width="210" height="76" rx="12" fill="#ffffff" stroke="#00aeef" stroke-width="1.75"/>
    <rect x="495.0" y="82.0" width="6" height="76" rx="3" fill="#00aeef"/>
    <text x="513.0" y="106.0" font-size="12" font-weight="700" fill="#0f2231">Global cGMP Standards</text>
    <rect x="513.0" y="114.0" width="127.0" height="17" rx="4" fill="#00aeef15"/>
    <text x="518.0" y="126.0" font-size="9.5" font-weight="700" fill="#00aeef">US FDA • EMA • ICH</text>
    <text x="513.0" y="144.0" font-size="9" font-weight="500" fill="#64748b">21 CFR Part 210/211 &amp; Annex 1</text>
  </g>

