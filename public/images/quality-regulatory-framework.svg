    <rect x="728.3452377915607" y="645.3452377915607" width="210" height="76" rx="12" fill="#ffffff" stroke="#f58634" stroke-width="1.75"/>
    <rect x="728.3452377915607" y="645.3452377915607" width="6" height="76" rx="3" fill="#f58634"/>
